<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tabinda Samar</title>

    <!-- 🔒 Authentication Guard (Bina login page open nahi hoga) -->
    <script>
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            padding-bottom: 1rem;
        }

        .admin-header h1 {
            color: #e6f1ff;
            font-size: 2rem;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background-color: #112240;
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .stat-icon {
            font-size: 2rem;
            color: #64ffda;
        }

        .stat-info h3 {
            color: #8892b0;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .stat-info span {
            color: #e6f1ff;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-card, .table-card {
            background-color: #112240;
            padding: 1.8rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-card h2, .table-card h2 {
            color: #e6f1ff;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            color: #8892b0;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            background-color: #0a192f;
            border: 1px solid rgba(100, 255, 218, 0.2);
            color: #e6f1ff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #64ffda;
        }

        .btn-submit {
            background-color: transparent;
            color: #64ffda;
            border: 1px solid #64ffda;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background-color: rgba(100, 255, 218, 0.1);
        }

        .project-table {
            width: 100%;
            border-collapse: collapse;
        }

        .project-table th, .project-table td {
            padding: 0.9rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .project-table th {
            color: #64ffda;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .project-table td {
            color: #8892b0;
            font-size: 0.9rem;
        }

        .btn-danger {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.3rem 0.6rem;
            transition: color 0.2s ease;
        }

        .btn-danger:hover {
            color: #ff5252;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fa-solid fa-gauge-high" style="color: #64ffda; margin-right: 10px;"></i> Portfolio Admin Dashboard</h1>
        </div>

        <!-- Dashboard Statistics -->
        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-folder-open"></i></div>
                <div class="stat-info">
                    <h3>Total Projects</h3>
                    <span id="stat-total">4</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-code"></i></div>
                <div class="stat-info">
                    <h3>Active Categories</h3>
                    <span>3</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-eye"></i></div>
                <div class="stat-info">
                    <h3>Status</h3>
                    <span style="font-size: 1.2rem; color: #64ffda;">Live & Syncing</span>
                </div>
            </div>
        </div>

        <!-- Dashboard Content Grid -->
        <div class="dashboard-grid">
            <!-- Add / Edit Project Form -->
            <div class="form-card">
                <h2><i class="fa-solid fa-plus-circle"></i> Add New Project</h2>
                <form id="add-project-form">
                    <div class="form-group">
                        <label for="p-title">Project Title</label>
                        <input type="text" id="p-title" placeholder="e.g. Modern E-Commerce Store" required>
                    </div>
                    <div class="form-group">
                        <label for="p-category">Category</label>
                        <select id="p-category" required>
                            <option value="WordPress / Elementor">WordPress / Elementor</option>
                            <option value="WordPress / WooCommerce">WordPress / WooCommerce</option>
                            <option value="UI/UX Design / Web Design">UI/UX Design / Web Design</option>
                            <option value="Power BI / Cybersecurity">Power BI / Cybersecurity</option>
                            <option value="Web Development">Web Development</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="p-desc">Description</label>
                        <textarea id="p-desc" rows="4" placeholder="Brief project overview and tech stack..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="p-image">Main Cover Image Path</label>
                        <input type="text" id="p-image" placeholder="images/Calligraphy/Calligraphy 1.png" required>
                    </div>
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Add Project</button>
                </form>
            </div>

            <!-- Manage Active Projects Table -->
            <div class="table-card">
                <h2><i class="fa-solid fa-list-check"></i> Manage Projects</h2>
                <div style="overflow-x: auto;">
                    <table class="project-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="projects-list-body">
                            <!-- Rendered dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Tabinda Samar. All rights reserved.</p>
    </footer>

    <script>
        // Sample Portfolio Projects Manager Script
        const adminProjects = [
            { id: 1, title: "Calligraphy Store", category: "WordPress / Elementor" },
            { id: 2, title: "Pharmacy Platform", category: "WordPress / WooCommerce" },
            { id: 3, title: "Velora Apparel Store", category: "WordPress / Elementor" },
            { id: 4, title: "Cyber Threat Dashboard", category: "Power BI / Cybersecurity" }
        ];

        function renderAdminTable() {
            const tableBody = document.getElementById('projects-list-body');
            tableBody.innerHTML = '';

            adminProjects.forEach((proj, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: #e6f1ff; font-weight: 500;">${proj.title}</td>
                    <td>${proj.category}</td>
                    <td>
                        <button class="btn-danger" onclick="deleteProject(${index})" title="Delete Project"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = adminProjects.length;
        }

        function deleteProject(index) {
            if (confirm("Are you sure you want to remove this project?")) {
                adminProjects.splice(index, 1);
                renderAdminTable();
            }
        }

        document.getElementById('add-project-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const category = document.getElementById('p-category').value;

            adminProjects.push({ id: Date.now(), title, category });
            renderAdminTable();

            this.reset();
            alert("Project added successfully!");
        });

        // Initial Table Render
        renderAdminTable();
    </script>
    <!-- Footer Section -->
<footer style="background: #0a192f; color: #8892b0; text-align: center; padding: 2rem 1rem; border-top: 1px solid #233554; margin-top: 3rem;">
    <div style="max-width: 1200px; margin: 0 auto;">
        <p style="margin-bottom: 0.8rem;">Designed & Built by <span style="color: #64ffda; font-weight: 600;">Tabinda Samar</span></p>
        
        <!-- Social Icons / Links -->
        <div style="display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1rem; font-size: 1.2rem;">
            <a href="https://github.com/" target="_blank" style="color: #8892b0; text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='#64ffda'" onmouseout="this.style.color='#8892b0'"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.linkedin.com/in/tabinda-samar-846a65338/" target="_blank" style="color: #8892b0; text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='#64ffda'" onmouseout="this.style.color='#8892b0'"><i class="fa-brands fa-linkedin"></i></a>
            <a href="mailto:tabinda.samar123@gmail.com" style="color: #8892b0; text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='#64ffda'" onmouseout="this.style.color='#8892b0'"><i class="fa-solid fa-envelope"></i></a>
        </div>

        <p style="font-size: 0.85rem; color: #4a5568;">&copy; 2026 Tabinda Samar. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
