<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Tabinda Samar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .details-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #64ffda;
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .project-header {
            margin-bottom: 2rem;
        }

        .project-header h1 {
            font-size: 2.2rem;
            color: #e6f1ff;
            margin-bottom: 0.5rem;
        }

        .project-category {
            color: #64ffda;
            font-size: 1rem;
            font-weight: 500;
        }

        .main-image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #112240;
            border: 1px solid rgba(100, 255, 218, 0.15);
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .main-image-container img {
            width: 100%;
            max-height: 550px;
            object-fit: contain;
            display: block;
            border-radius: 12px;
            transition: opacity 0.3s ease;
        }

        .thumbnails-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 5px 15px 5px;
            scrollbar-width: thin;
            scrollbar-color: #64ffda #0a192f;
        }

        .thumbnails-grid::-webkit-scrollbar {
            height: 6px;
        }

        .thumbnails-grid::-webkit-scrollbar-thumb {
            background: #64ffda;
            border-radius: 4px;
        }

        .thumb-item {
            min-width: 110px;
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.2s ease;
            background-color: #112240;
            flex-shrink: 0;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-item:hover, .thumb-item.active {
            opacity: 1;
            border-color: #64ffda;
            transform: translateY(-2px);
        }

        .project-overview {
            margin-top: 2.5rem;
            background: #112240;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .project-overview h2 {
            font-size: 1.5rem;
            color: #e6f1ff;
            margin-bottom: 1rem;
        }

        .project-overview p {
            color: #8892b0;
            line-height: 1.7;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <h1>Tabinda <span>Samar</span></h1>
        <nav>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="admin.html" class="btn-secondary" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;"><i class="fa-solid fa-user-gear"></i> Admin</a></li>
            </ul>
        </nav>
    </header>

    <div class="details-container">
        <!-- Back Navigation -->
        <a href="index.html#projects" class="back-link">&larr; Back to Projects</a>

        <!-- Dynamic Header Details -->
        <div class="project-header">
            <h1 id="proj-title">Loading Project...</h1>
            <div id="proj-category" class="project-category">Category</div>
        </div>

        <!-- Main Featured Screenshot Showcase -->
        <div class="main-image-container">
            <img id="main-display-img" src="" alt="Project Showcase Image">
        </div>

        <!-- Gallery Thumbnails Bar -->
        <div class="thumbnails-grid" id="thumbnails-container">
            <!-- Dynamic Thumbnails Render Here -->
        </div>

        <!-- Project Description & Overview -->
        <div class="project-overview">
            <h2>Project Overview & Features</h2>
            <p id="proj-description">
                Loading project description and feature breakdown...
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Tabinda Samar. All rights reserved.</p>
    </footer>

    <!-- JavaScript For Dynamic URL Query & Gallery Switch -->
    <script>
        const projectsData = {
            calligraphy: {
                title: "Calligraphy & Hand Lettering Store",
                category: "WordPress / Elementor",
                description: "An artistic digital storefront showcasing bespoke calligraphy, custom hand-lettering work, client testimonials, art portfolios, and order inquiry forms.",
                images: [
                    "images/Calligraphy/Calligraphy 1.png",
                    "images/Calligraphy/Calligraphy 2.png",
                    "images/Calligraphy/Calligraphy 3.png",
                    "images/Calligraphy/Calligraphy 4.png",
                    "images/Calligraphy/Calligraphy 5.png",
                    "images/Calligraphy/Calligraphy 6.png",
                    "images/Calligraphy/Calligraphy 7.png"
                ]
            },
            homespire: {
                title: "HomeSpire Interior Design",
                category: "UI/UX Design / Web Design",
                description: "Refined interior design storefront and service landing page focusing on luxury architectural planning, dynamic showcase grids, pricing options, and interactive contact layout.",
                images: [
                    "images/homespire/Homespire 1.png",
                    "images/homespire/Homespire 2.png",
                    "images/homespire/Homespire 3.png",
                    "images/homespire/Homespire 4.png",
                    "images/homespire/Homespire 5.png",
                    "images/homespire/Homespire 6.png",
                    "images/homespire/Homespire 7.png",
                    "images/homespire/Homespire 8.png"
                ]
            },
            medicine: {
                title: "Pharmacy & Healthcare Platform",
                category: "WordPress / WooCommerce",
                description: "Custom e-commerce pharmacy store featuring organized medicine categories, full responsiveness, dynamic cart management, and seamless checkout experience designed for pharmaceuticals.",
                images: [
                    "images/Medicine/Medicine 1.png",
                    "images/Medicine/Medicine 2.png",
                    "images/Medicine/Medicine 3.png",
                    "images/Medicine/Medicine 4.png",
                    "images/Medicine/Medicine 5.png",
                    "images/Medicine/Medicine 6.png",
                    "images/Medicine/Medicine 7.png"
                ]
            },
            velora: {
                title: "Velora Apparel & Fashion Store",
                category: "WordPress / Elementor",
                description: "Modern fashion and clothing brand website styled with soft neutral tones, custom hero sections, featured collection grids, pricing breakdown, and fully optimized mobile UI.",
                images: [
                    "images/Velora/Velora 1.png",
                    "images/Velora/Velora 2.png",
                    "images/Velora/Velora 3.png",
                    "images/Velora/Velora 4.png",
                    "images/Velora/Velora 5.png",
                    "images/Velora/Velora 6.png",
                    "images/Velora/Velora 7.png",
                    "images/Velora/Velora 8.png"
                ]
            },
            powerbi: {
                title: "Cyber Threat Intelligence Dashboard",
                category: "Power BI / Cybersecurity",
                description: "Interactive Power BI analytics dashboard designed to visualize real-time cyber threat intelligence. Includes monitoring for IP network traffic, threat severity metrics, attack vectors, and risk level breakdown.",
                images: [
                    "images/Cyber powerBI dashboard/power bi 1.png",
                    "images/Cyber powerBI dashboard/power bi 2.png",
                    "images/Cyber powerBI dashboard/power bi 3.png",
                    "images/Cyber powerBI dashboard/power bi 4.png"
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const currentProjectKey = urlParams.get('project') || 'velora';

        function renderProjectDetails(key) {
            const project = projectsData[key] || projectsData['velora'];

            document.getElementById('proj-title').innerText = project.title;
            document.getElementById('proj-category').innerText = project.category;
            document.getElementById('proj-description').innerText = project.description;

            const mainImg = document.getElementById('main-display-img');
            const thumbnailsContainer = document.getElementById('thumbnails-container');

            mainImg.src = project.images[0];

            thumbnailsContainer.innerHTML = '';
            project.images.forEach((imgSrc, index) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = `thumb-item ${index === 0 ? 'active' : ''}`;
                
                const thumbImg = document.createElement('img');
                thumbImg.src = imgSrc;
                thumbImg.alt = `${project.title} screenshot ${index + 1}`;

                thumbDiv.appendChild(thumbImg);

                thumbDiv.addEventListener('click', () => {
                    mainImg.style.opacity = '0.3';
                    setTimeout(() => {
                        mainImg.src = imgSrc;
                        mainImg.style.opacity = '1';
                    }, 150);

                    document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
                    thumbDiv.classList.add('active');
                });

                thumbnailsContainer.appendChild(thumbDiv);
            });
        }

        renderProjectDetails(currentProjectKey);
    </script>
</body>
</html>
