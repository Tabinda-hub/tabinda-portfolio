<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tabinda Samar</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a192f;
        }
        .login-card {
            background: #112240;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid rgba(100, 255, 218, 0.2);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
        }
        .login-card h2 {
            color: #e6f1ff;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            color: #8892b0;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid #233554;
            background: #0a192f;
            color: #e6f1ff;
            outline: none;
        }
        .form-group input:focus {
            border-color: #64ffda;
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: transparent;
            border: 1px solid #64ffda;
            color: #64ffda;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
            transition: 0.3s;
        }
        .btn-login:hover {
            background: rgba(100, 255, 218, 0.1);
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
            <p id="errorMsg" class="error-msg">Invalid Username or Password!</p>
        </form>
    </div>
</div>

<script>
    // Hardcoded Admin Credentials
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "tabinda123"; // Apni marzi ka password rakhein

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userInput = document.getElementById('username').value.trim();
        const passInput = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (userInput === ADMIN_USER && passInput === ADMIN_PASS) {
            // Set session flag in localStorage
            localStorage.setItem('isAdminLoggedIn', 'true');
            window.location.href = 'admin.html';
        } else {
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
